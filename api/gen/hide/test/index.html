<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Salt Admin Panel</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: linear-gradient(135deg, #f5f7fa, #e4e8f0); min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
        .card { background: white; border-radius: 32px; padding: 32px; max-width: 500px; width: 100%; box-shadow: 0 20px 40px rgba(0,0,0,0.1); }
        h1 { color: #a855f7; margin-bottom: 8px; }
        input, select, button { width: 100%; padding: 12px; margin: 8px 0; border-radius: 60px; border: 1px solid #ddd; }
        button { background: #a855f7; color: white; font-weight: bold; cursor: pointer; border: none; }
        button:hover { background: #7c3aed; }
        .result { margin-top: 16px; padding: 12px; border-radius: 16px; background: #f3f4f6; word-break: break-all; }
    </style>
</head>
<body>
    <div class="card">
        <h1>🔐 Salt Admin Panel</h1>
        <p>Secure key generation</p>
        <input type="password" id="adminPass" placeholder="Admin Password">
        <select id="duration"><option value="1">1 Day</option><option value="7">7 Days</option><option value="30">30 Days</option><option value="365">Permanent (365 Days)</option></select>
        <button id="generateBtn">Generate Key</button>
        <div id="result" class="result" style="display:none;"></div>
    </div>
    <script>
        const ADMIN_PASS = 'SALTY-WAS-HEREWITHSUGAR_ezez.meow.ez.kidd_keno';
        document.getElementById('generateBtn').onclick = async () => {
            const pass = document.getElementById('adminPass').value;
            if(pass !== ADMIN_PASS) { alert('Wrong password'); return; }
            const duration = parseInt(document.getElementById('duration').value);
            const res = await fetch('/api/generate-key', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ password: pass, duration })
            });
            const data = await res.json();
            const resultDiv = document.getElementById('result');
            if(data.success) {
                resultDiv.style.display = 'block';
                resultDiv.innerHTML = `<strong>✅ Key Generated:</strong><br>${data.key}<br><br>Expires: ${new Date(data.expiry).toLocaleString()}`;
            } else {
                resultDiv.style.display = 'block';
                resultDiv.innerHTML = `❌ Error: ${data.error}`;
            }
        };
    </script>
</body>
</html>
