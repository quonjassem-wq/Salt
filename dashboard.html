<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Salt Executor | Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg: #0a0a0f;
            --surface: rgba(255,255,255,0.05);
            --surface-hover: rgba(255,255,255,0.08);
            --text: #ffffff;
            --text-sec: #a1a1aa;
            --border: rgba(255,255,255,0.1);
            --accent: #a855f7;
        }
        body.light {
            --bg: #f4f4f9;
            --surface: rgba(0,0,0,0.03);
            --surface-hover: rgba(0,0,0,0.05);
            --text: #111111;
            --text-sec: #3f3f46;
            --border: rgba(0,0,0,0.1);
            --accent: #7c3aed;
        }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); transition: 0.3s; }
        .container { max-width: 1000px; margin: 0 auto; padding: 40px 24px; }
        .card { background: var(--surface); border: 1px solid var(--border); border-radius: 32px; padding: 32px; text-align: center; backdrop-filter: blur(8px); }
        input, button { padding: 12px 20px; border-radius: 60px; border: none; font-size: 1rem; }
        input { background: var(--bg); border: 1px solid var(--border); color: var(--text); width: 250px; margin-right: 12px; }
        button { background: var(--accent); color: white; cursor: pointer; transition: 0.2s; }
        button:hover { transform: scale(1.02); }
        .hidden-content { display: none; margin-top: 40px; }
        .stat-card { background: var(--surface); border-radius: 24px; padding: 24px; margin-top: 20px; border: 1px solid var(--border); }
        footer { text-align: center; padding: 40px; border-top: 1px solid var(--border); color: var(--text-sec); margin-top: 60px; }
        .theme-toggle { position: fixed; top: 20px; right: 20px; background: var(--surface); border: 1px solid var(--border); border-radius: 40px; padding: 8px 16px; cursor: pointer; z-index: 100; }
        .error { color: #ef4444; margin-top: 16px; }
        .success { color: #10b981; margin-top: 16px; }
        .btn-outline { background: transparent; border: 1px solid var(--accent); color: var(--text); margin-top: 20px; }
    </style>
</head>
<body>
    <button class="theme-toggle" id="themeToggle"><i class="fas fa-moon"></i></button>
    <div class="container">
        <div class="card">
            <h1><i class="fas fa-lock"></i> Dashboard Access</h1>
            <p>Enter your Salt key to unlock the dashboard.</p>
            <div style="margin: 24px 0;">
                <input type="text" id="keyInput" placeholder="SALT-XXXX-XXXX">
                <button id="unlockBtn">Unlock Dashboard</button>
            </div>
            <div id="message"></div>
        </div>

        <div id="dashboardContent" class="hidden-content">
            <div class="stat-card">
                <h2><i class="fas fa-chart-line"></i> Welcome to your Salt Dashboard</h2>
                <p>Your key is active. Here you can manage your subscription and view stats.</p>
                <hr style="margin: 20px 0; border-color: var(--border);">
                <h3>Your Key Info</h3>
                <p id="keyInfo">Loading...</p>
                <button class="btn-outline" onclick="window.location.href='/'">Back to Home</button>
            </div>
        </div>
    </div>
    <footer>&copy; 2026 Salt Executor</footer>

    <script>
        const unlockBtn = document.getElementById('unlockBtn');
        const keyInput = document.getElementById('keyInput');
        const messageDiv = document.getElementById('message');
        const dashboardDiv = document.getElementById('dashboardContent');

        async function checkKey(key) {
            try {
                const res = await fetch(`/api/check-key?key=${encodeURIComponent(key)}`);
                const data = await res.json();
                if (data.valid) {
                    messageDiv.innerHTML = `<span class="success"><i class="fas fa-check-circle"></i> Key valid! Loading dashboard...</span>`;
                    dashboardDiv.style.display = 'block';
                    document.getElementById('keyInfo').innerHTML = `Key: ${key}<br>Expires: ${new Date(data.expiry).toLocaleString()}<br>Status: Active`;
                } else {
                    messageDiv.innerHTML = `<span class="error"><i class="fas fa-times-circle"></i> ${data.message || 'Invalid or expired key'}</span>`;
                    dashboardDiv.style.display = 'none';
                }
            } catch (err) {
                messageDiv.innerHTML = `<span class="error">Error connecting to server. Make sure the API is deployed.</span>`;
            }
        }

        unlockBtn.onclick = () => {
            const key = keyInput.value.trim();
            if(!key) { messageDiv.innerHTML = '<span class="error">Enter a key.</span>'; return; }
            checkKey(key);
        };

        // Theme
        const themeToggle = document.getElementById('themeToggle');
        const currentTheme = localStorage.getItem('theme') || 'dark';
        if(currentTheme === 'light') document.body.classList.add('light');
        themeToggle.innerHTML = currentTheme === 'light' ? '<i class="fas fa-sun"></i>' : '<i class="fas fa-moon"></i>';
        themeToggle.onclick = () => {
            document.body.classList.toggle('light');
            const isLight = document.body.classList.contains('light');
            localStorage.setItem('theme', isLight ? 'light' : 'dark');
            themeToggle.innerHTML = isLight ? '<i class="fas fa-sun"></i>' : '<i class="fas fa-moon"></i>';
        };
    </script>
</body>
</html>
